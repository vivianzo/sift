<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keepsake Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: a clickable phone on the left, a design-notes column on the right that follows the current screen; stacks on narrow widths.
   Direction: cream stationery, navy ink, one rose accent. Hairlines over shadows, small radii, a serif that does the "cute" work in italics. */
:root{
  --bg:#F5F0E8; --paper:#FFFDF8; --screen:#FBF8F2; --ink:#1E2643; --muted:#6F6E7C; --line:#E4DBCD;
  --accent:#C2607A; --accent-soft:#F5E2E5; --btn:#1E2643; --btn-ink:#FBF8F2; --link:#1E2643;
  --sticker:#1E2643; --sticker-ink:#FBF8F2; --tape:rgba(226,186,190,.62); --bezel:#161B30; --chip:#EFE8DC;
  --good:#4E7A63; --good-soft:#E3ECE4; --warn:#9A5B2E; --warn-soft:#F4E6D6;
  --shadow:0 1px 0 rgba(30,38,67,.04),0 10px 30px -12px rgba(30,38,67,.18);
  --r-lg:10px; --r-md:6px; --r-sm:3px;
  --f-display:'Instrument Serif','Iowan Old Style','Times New Roman',serif;
  --f-body:'Manrope',system-ui,-apple-system,sans-serif;
  --f-mono:'DM Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1328; --paper:#192040; --screen:#131833; --ink:#F2EBE0; --muted:#A3A4B8; --line:#2B3257;
  --accent:#E59BB0; --accent-soft:#38294A; --btn:#E59BB0; --btn-ink:#141833; --link:#E59BB0;
  --sticker:#F2EBE0; --sticker-ink:#1E2643; --tape:rgba(229,155,176,.32); --bezel:#05070F; --chip:#212849;
  --good:#9CC7AE; --good-soft:#1F3436; --warn:#E3B07F; --warn-soft:#3A2E2E;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1328; --paper:#192040; --screen:#131833; --ink:#F2EBE0; --muted:#A3A4B8; --line:#2B3257;
  --accent:#E59BB0; --accent-soft:#38294A; --btn:#E59BB0; --btn-ink:#141833; --link:#E59BB0;
  --sticker:#F2EBE0; --sticker-ink:#1E2643; --tape:rgba(229,155,176,.32); --bezel:#05070F; --chip:#212849;
  --good:#9CC7AE; --good-soft:#1F3436; --warn:#E3B07F; --warn-soft:#3A2E2E;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.5;padding-block:28px 48px;padding-inline:16px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:1.5px solid var(--accent);outline-offset:2px;border-radius:var(--r-md)}
.mono{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;color:var(--muted);font-variant-numeric:tabular-nums}
.display{font-family:var(--f-display);font-weight:400;letter-spacing:-.01em;text-wrap:balance;margin:0}
.display em,.it{font-style:italic}

.stage{display:grid;grid-template-columns:minmax(0,390px) minmax(0,340px);gap:48px;justify-content:center;align-items:start;max-width:830px;margin:0 auto}
@media (max-width:800px){.stage{grid-template-columns:minmax(0,1fr);justify-items:center;gap:28px}}

/* phone */
.phone{width:min(390px,100%);height:800px;border:10px solid var(--bezel);border-radius:50px;background:var(--screen);position:relative;overflow:hidden;box-shadow:0 30px 60px -30px rgba(30,38,67,.45)}
@media (max-width:480px){.phone{border-width:6px;border-radius:34px;height:760px}}
.status{position:absolute;top:0;left:0;right:0;height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-weight:700;font-size:14px;z-index:5;background:linear-gradient(var(--screen) 60%,transparent)}
.status .island{width:96px;height:26px;border-radius:20px;background:var(--bezel)}
.status .bat{width:24px;height:11px;border:1.5px solid var(--ink);border-radius:3px;position:relative}
.status .bat::after{content:"";position:absolute;inset:1.5px 5px 1.5px 1.5px;background:var(--ink);border-radius:1px}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:54px 20px 96px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll.nosbar{padding-bottom:28px}
.enter{animation:enter .26s ease-out}
@keyframes enter{from{opacity:.3;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.enter{animation:none}}

.tabbar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:10px 40px 22px;background:color-mix(in srgb,var(--screen) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:5}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:72px;position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-current="true"]{color:var(--ink)}
.tab .dot{position:absolute;top:-3px;right:12px;background:var(--accent);color:#fff;font-size:9.5px;letter-spacing:0;border-radius:8px;padding:0 5px;line-height:15px}

/* shared bits */
.top{padding:10px 2px 18px;border-bottom:1px solid var(--line);margin-bottom:18px}
.top .eyebrow{text-transform:uppercase;letter-spacing:.22em;font-size:9.5px;color:var(--accent)}
.top h1{font-size:46px;line-height:1;margin-top:6px}
.top p{margin:8px 0 0;color:var(--muted);font-size:13.5px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;letter-spacing:.03em;padding:3px 8px;border-radius:var(--r-sm);background:var(--chip);color:var(--muted);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.hot{background:var(--accent-soft);color:var(--accent)}
.primary{background:var(--btn);color:var(--btn-ink);font-weight:600;letter-spacing:.02em;border-radius:var(--r-md);padding:14px 18px;font-size:14px;width:100%}
.ghost{background:transparent;border:1px solid var(--line);font-weight:600;border-radius:var(--r-md);padding:13px 16px;font-size:13.5px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:36px;margin-bottom:8px}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--link);font-weight:600;font-size:14px}
.back svg{width:18px;height:18px}
.sticker{font-family:var(--f-display);font-style:italic;font-size:17px;line-height:1;background:var(--sticker);color:var(--sticker-ink);padding:4px 10px 5px;border-radius:var(--r-sm);transform:rotate(-4deg);position:absolute;z-index:2}
.bar{height:3px;border-radius:2px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}

/* home cards */
.cards{display:grid;gap:20px}
.evcard{display:block;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:6px;position:relative;width:100%}
.collage{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:3px;height:176px;border-radius:var(--r-md);overflow:hidden}
.collage img{width:100%;height:100%;object-fit:cover;display:block;background:var(--chip)}
.collage img:first-child{grid-row:span 2}
.evcard .sticker{top:-8px;right:14px}
.evbody{padding:12px 8px 8px;display:grid;gap:6px}
.evbody h3{font-family:var(--f-display);font-weight:400;font-size:23px;margin:0;line-height:1.1}
.evrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.evrow span{font-size:12.5px;color:var(--muted)}

/* event */
.evhead h2{font-size:36px;line-height:1.02}
.evhead .mono{margin:6px 0 0}
.why{display:flex;gap:10px;align-items:flex-start;margin:16px 0 4px;padding:11px 12px;border-radius:var(--r-md);background:var(--paper);border:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.why b{color:var(--ink);font-weight:600}
.why svg{flex:none;width:16px;height:16px;color:var(--accent);margin-top:2px}
.prog{display:grid;gap:7px;margin:16px 0 20px}
.prog .evrow span{font-size:12px}
.stackgrid{display:grid;grid-template-columns:1fr 1fr;gap:24px 16px}
.pile{display:grid;gap:8px;text-align:left}
.pile .layers{position:relative;aspect-ratio:3/4;max-width:100%}
.pile .layers img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:var(--r-sm);border:3px solid var(--paper);box-shadow:var(--shadow);background:var(--chip)}
.pile .layers img:nth-child(1){transform:rotate(-5deg) translate(-3px,4px)}
.pile .layers img:nth-child(2){transform:rotate(4deg) translate(3px,2px)}
.pile.done .layers img{transform:none}
.badge{position:absolute;right:-5px;top:-7px;z-index:3;background:var(--ink);color:var(--screen);font-family:var(--f-mono);font-size:10.5px;border-radius:var(--r-sm);padding:2px 6px}
.pile.done .badge{background:var(--good);color:var(--screen);display:inline-flex;gap:3px;align-items:center}
.badge svg{width:11px;height:11px}
.pile .lbl{display:flex;justify-content:space-between;gap:6px}
.cta{position:sticky;bottom:-80px;padding-top:24px}

/* sort */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-md);padding:2px}
.seg button{font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:4px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--screen)}
.sorthead{display:flex;justify-content:space-between;align-items:baseline;margin:4px 0 12px;gap:8px}
.sorthead b{font-family:var(--f-display);font-weight:400;font-size:24px}
.hero{position:relative;border-radius:var(--r-md);overflow:hidden;aspect-ratio:3/4;max-width:100%;background:var(--chip)}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .sticker{top:14px;left:12px}
.hero .over{position:absolute;left:0;right:0;bottom:0;padding:40px 12px 12px;background:linear-gradient(transparent,rgba(20,24,48,.6));display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.hero .over .mono{color:rgba(255,253,248,.85);margin-left:auto}
.over .chip{background:rgba(255,253,248,.92);color:#1E2643}
.strip{display:flex;gap:8px;margin:12px 0 14px;overflow-x:auto;padding:4px 2px}
.strip button{flex:none;width:56px;aspect-ratio:3/4;border-radius:var(--r-sm);overflow:hidden;position:relative;opacity:.6;outline:1.5px solid transparent;outline-offset:2px;transition:opacity .15s}
.strip button[aria-pressed="true"]{opacity:1;outline-color:var(--accent)}
.strip img{width:100%;height:100%;object-fit:cover;display:block}
.strip .star{position:absolute;top:3px;left:3px;width:13px;height:13px;color:#fff;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.actions{display:grid;grid-template-columns:auto 1fr;gap:10px}
.fine{font-size:12px;color:var(--muted);text-align:center;margin:10px 0 0}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.shot{position:relative;border-radius:var(--r-md);overflow:hidden;aspect-ratio:3/4;max-width:100%;background:var(--chip);outline:2px solid transparent;outline-offset:-2px;transition:outline-color .15s}
.shot img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .2s}
.shot[aria-pressed="false"] img{filter:saturate(.5) brightness(.85)}
.shot[aria-pressed="true"]{outline-color:var(--accent)}
.shot .heart{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(255,253,248,.9);color:#C9BFC4}
.shot[aria-pressed="true"] .heart{background:var(--accent);color:#fff}
.shot .heart svg{width:15px;height:15px}
.shot .tags{position:absolute;left:6px;bottom:6px;right:6px;display:flex;flex-wrap:wrap;gap:4px}
.shot .tags .chip{font-size:9.5px;padding:2px 6px;background:rgba(255,253,248,.92);color:#1E2643}
.shot .tags .chip.warn{background:rgba(250,236,220,.95);color:#8A4A1E}
.shot .sticker{top:8px;left:6px;font-size:14px}

/* done */
.done{text-align:center;padding-top:26px}
.fan{position:relative;height:230px;margin:0 auto 20px;width:100%;max-width:320px}
.fan .pol{position:absolute;left:50%;top:10px;width:130px;margin-left:-65px}
.done h2{font-size:32px;line-height:1.05;padding:0 6px}
.done p{color:var(--muted);margin:12px 8px 22px;font-size:13.5px}
.statrow{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:20px;text-align:left;background:var(--paper)}
.stat{padding:12px 14px}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{display:block;font-family:var(--f-display);font-weight:400;font-size:34px;font-variant-numeric:tabular-nums;line-height:1}
.stat span{font-size:12px;color:var(--muted)}
.stack-btns{display:grid;gap:10px}

/* vault */
.pol{background:#FFFDF8;padding:7px 7px 26px;border-radius:1px;box-shadow:0 1px 2px rgba(30,38,67,.10),0 12px 24px -10px rgba(30,38,67,.25);position:relative}
.pol img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#eee}
.pol .cap{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-family:var(--f-display);font-style:italic;font-size:14px;color:#3B4262;line-height:1}
.pol .tape{position:absolute;top:-8px;left:50%;width:48px;height:16px;margin-left:-24px;background:var(--tape);transform:rotate(-4deg)}
.spread{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:18px 14px 22px;margin-bottom:18px}
.spread header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.spread h3{font-family:var(--f-display);font-style:italic;font-weight:400;font-size:26px;line-height:1;margin:0}
.spread .stamp{border:1px solid var(--accent);color:var(--accent);border-radius:2px;padding:2px 6px;transform:rotate(2deg);font-size:9.5px;text-transform:uppercase;letter-spacing:.14em}
.pols{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 10px;padding:4px 4px 0}
.pols .pol{padding:5px 5px 18px}
.pols .pol .cap{font-size:11.5px}
.pols .more{display:grid;place-items:center;font-family:var(--f-display);font-style:italic;font-size:18px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r-sm);aspect-ratio:3/4.4}
.listrow{display:flex;align-items:center;gap:12px;background:transparent;border-top:1px solid var(--line);padding:13px 4px;width:100%;text-align:left}
.listrow svg{width:20px;height:20px;color:var(--muted);flex:none}
.listrow div{flex:1;min-width:0}
.listrow b{display:block;font-size:13.5px;font-weight:600}
.listrow span{font-size:12px;color:var(--muted)}
.empty{text-align:center;padding:28px 10px;color:var(--muted)}

.toast{position:absolute;left:50%;bottom:30px;transform:translate(-50%,20px);background:var(--ink);color:var(--screen);font-weight:600;font-size:12.5px;padding:10px 16px;border-radius:var(--r-md);opacity:0;transition:.25s;z-index:9;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* notes */
.notes{position:sticky;top:24px;display:grid;gap:14px;min-width:0;width:100%;max-width:390px}
.notes .kicker{text-transform:uppercase;letter-spacing:.2em;font-size:9.5px;color:var(--accent)}
.notes h2{font-family:var(--f-display);font-weight:400;font-size:32px;line-height:1.05;margin:0;text-wrap:balance}
.notes p{margin:0;max-width:62ch}
.notes .how{border-left:1px solid var(--accent);padding:2px 0 2px 14px;color:var(--muted);font-size:13.5px}
.notes .q{border:1px solid var(--line);background:var(--paper);border-radius:var(--r-md);padding:14px 16px}
.notes .q b{display:block;font-family:var(--f-display);font-style:italic;font-weight:400;font-size:20px;color:var(--accent);line-height:1;margin-bottom:6px}
.flow{display:flex;flex-wrap:wrap;gap:6px}
.flow button{font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:var(--r-sm);border:1px solid var(--line);color:var(--muted)}
.flow button[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--screen)}
</style>

<div class="stage">
  <div class="phone" id="phone">
    <div class="status"><span>9:41</span><span class="island"></span><span class="bat"></span></div>
    <div class="scroll" id="scroll"></div>
    <nav class="tabbar" id="tabbar"></nav>
    <div class="toast" id="toast"></div>
  </div>
  <aside class="notes" id="notes" aria-live="polite"></aside>
</div>

<script>
/* ---------- tiny helpers ---------- */
const rng = seed => { let s = (seed * 2654435761) >>> 0 || 1; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; };
const pick = (r, a) => a[Math.floor(r() * a.length)];
const $ = id => document.getElementById(id);
const I = {
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  heart:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.5s-7.5-4.4-9.3-9.2C1.5 8 3.6 4.5 7 4.5c2 0 3.4 1.1 5 3 1.6-1.9 3-3 5-3 3.4 0 5.5 3.5 4.3 6.8-1.8 4.8-9.3 9.2-9.3 9.2z"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 6.8L21 11l-6.8 2.2L12 20l-2.2-6.8L3 11l6.8-2.2z"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0113 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg>',
  moments:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="13" height="15" rx="2.5"/><path d="M8 3h10.5A2.5 2.5 0 0121 5.5V16"/></svg>',
  vault:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 015.5 4H11l1 2h6.5A1.5 1.5 0 0120 7.5v11a1.5 1.5 0 01-1.5 1.5h-13A1.5 1.5 0 014 18.5z"/><path d="M12 16.5s-3-1.8-3-3.8a1.6 1.6 0 013-.8 1.6 1.6 0 013 .8c0 2-3 3.8-3 3.8z" fill="currentColor" stroke="none"/></svg>',
  box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v9.5A1.5 1.5 0 006.5 20h11a1.5 1.5 0 001.5-1.5V9M10 13h4"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>'
};

/* ---------- placeholder photo generator (stand-ins for real camera roll shots) ---------- */
const W = 300, H = 400;
function friends(x, r, v, night){
  const g = x.createLinearGradient(0,0,0,H);
  const h = r()*360;
  if (night){ g.addColorStop(0,'#24143a'); g.addColorStop(1,'#5a2a5c'); }
  else { g.addColorStop(0,`hsl(${h},65%,86%)`); g.addColorStop(1,`hsl(${h+35},55%,74%)`); }
  x.fillStyle = g; x.fillRect(-40,-40,W+80,H+80);
  x.globalCompositeOperation = 'lighter';
  for (let i=0;i<9;i++){ x.fillStyle = `hsla(${r()*360},90%,70%,${night?.35:.18})`; x.beginPath(); x.arc(r()*W, r()*H*.6, 10+r()*26, 0, 7); x.fill(); }
  x.globalCompositeOperation = 'source-over';
  const n = 2 + (r() > .5 ? 1 : 0);
  const skins = ['#f3cfb0','#dba47c','#a9714c','#7b4b2f','#f6dcc4'], hairs = ['#2b1b14','#4a2e1e','#121014','#7a4a28','#d9b26a'];
  for (let i=0;i<n;i++){
    const cx = W*(i+.5)/n + (r()-.5)*18, cy = H*.47 + (r()-.5)*24;

const FLAGS = {concert:['blurry','tilted','too dark','near-duplicate'], friendsNight:['eyes closed','blurry','too dark'], friendsDay:['eyes closed','blurry','tilted'],
  city:['tilted','blurry','near-duplicate'], brunch:['blurry','too dark','near-duplicate'], sunset:['tilted','blurry','too dark']};
const REASONS = {concert:['sharpest','steady','best exposure'], friendsNight:['eyes open','faces in focus','sharpest'], friendsDay:['eyes open','faces in focus','sharpest'],
  city:['level','sharpest'], brunch:['sharpest','best light'], sunset:['level horizon','best light']};
const fmt = (m, sec) => { const h = Math.floor(m/60)%24, mm = Math.floor(m%60); const hh = h%12 || 12;
  return `${hh}:${String(mm).padStart(2,'0')}${sec != null ? ':' + String(sec).padStart(2,'0') : ''} ${h<12?'AM':'PM'}`; };

EVENTS.forEach((ev, e) => {
  const r = rng(ev.seed);
  ev.stacks = ev.scenes.map((scene, s) => {
    const size = 2 + Math.floor(r()*4), best = Math.floor(r()*size);
    const at = ev.start + ev.mins * s / ev.scenes.length + r()*4;
    let sec = Math.floor(r()*40);
    const shots = Array.from({length:size}, (_, j) => {
      const flags = [];
      const v = {dx:(r()-.5)*22, bright:(r()-.5)*.12, tilt:0, blur:false, closed:0};
      if (j !== best){
        const f = pick(r, FLAGS[scene]); flags.push(f);
        if (f === 'blurry') v.blur = true;
        if (f === 'tilted') v.tilt = (r() > .5 ? 1 : -1) * (5 + r()*4);
        if (f === 'too dark') v.bright = -.42;
        if (f === 'eyes closed') v.closed = 1 + Math.floor(r()*2);

        ${ks.length > 6 ? `<div class="more">+${ks.length - 5} more</div>` : ''}</div>
        ${t.sorted < t.stacks ? `<p class="mono" style="margin:14px 2px 0">${t.stacks - t.sorted} stacks still to sort</p>` : ''}</section>`;
    }).join('') || '<div class="empty">Sort a moment and your favorites land here.</div>'}
    <button class="listrow" data-act="toast" data-msg="Archive is a plain album in Photos you can review or empty">${I.box}<div><b>Archive</b><span>${archived} photos you passed on</span></div></button>
    ${waiting.map(([ev, e]) => `<button class="listrow" data-act="open" data-e="${e}">${I.clock}<div><b>${ev.title}</b><span>${stats(e).stacks - stats(e).sorted} stacks waiting</span></div></button>`).join('')}`;
}

const NOTES = {
  home:{k:'Screen 1 · Moments', h:'Albums that make themselves',
    p:'Every time you open the app it scans new photos and groups them into moments. A new moment starts when there is a long gap in time or you move somewhere else.',
    how:'On device: PhotoKit gives each photo a timestamp and GPS location. Cluster by gaps of about 90 minutes or about 1 km, then name it from the venue or neighborhood with reverse geocoding.',
    q:'Should a whole trip be one moment, or one per day like the Lisbon card?'},
  event:{k:'Screen 2 · One moment', h:'Piles of near-identical shots',
    p:'Each pile is a stack: shots taken seconds apart that look almost the same. You sort piles instead of 31 single photos. The "why" box is there so the grouping never feels random.',
    how:'On device: Apple\'s Vision framework gives each photo a "feature print". Shots close in time whose prints are close in distance go in the same stack.',
    q:'Single photos that match nothing: show them as their own section, or keep them all automatically?'},
  sort:{k:'Screen 3 · Sorting', h:'Two ways to pick a winner',
    p:'Quick pick shows the app\'s best guess and you confirm with one tap. Compare shows every shot side by side and you heart the keepers. Switch between them at the top and try a few stacks each way.',
    how:'Best guess: Vision scores sharpness and image quality and detects faces and closed eyes. The chips explain the pick ("eyes open", "level horizon").',
    q:'Which style would you actually use at 1 a.m. on the train home from a concert?'},
  done:{k:'Screen 4 · Finished', h:'A small reward, and nothing deleted',
    p:'Finishing a moment should feel good. The photos you passed on go to an Archive album, which removes the fear of losing a photo for good, a big reason people never clean up.',
    how:'Archive is a normal album in Photos. Emptying it can go through iOS Recently Deleted, so it stays reversible for 30 days.',
    q:'Would you want a "clear Archive" reminder after a few weeks, or never?'},
  vault:{k:'Screen 5 · Vault', h:'The scrapbook of favorites',
    p:'Only keepers show up here, laid out as pages per moment instead of a grid. This is the screen you would scroll for nostalgia or open when planning a post.',
    how:'Storage: the app saves PhotoKit identifiers, the moment details and your picks. It never copies image files, so the vault is a few kilobytes.',
    q:'Captions: write your own, have the app suggest them, or skip them?'}
};

function render(){
  const sc = $('scroll');
  sc.innerHTML = ({home, event:eventScreen, sort:sortScreen, done:doneScreen, vault})[S.screen]();
  sc.classList.toggle('nosbar', S.screen === 'sort');
  sc.querySelectorAll('img[data-k]').forEach(el => { const [e, s, j] = el.dataset.k.split('-').map(Number); el.src = photo(e, s, j); });
  const onVault = S.screen === 'vault';
  const kept = EVENTS.reduce((a, _, e) => a + stats(e).kept, 0);
  $('tabbar').hidden = S.screen === 'sort';
  $('tabbar').innerHTML = `<button class="tab" data-act="home" aria-current="${!onVault}">${I.moments}Moments</button>
    <button class="tab" data-act="vault" aria-current="${onVault}">${I.vault}Vault<span class="dot">${kept}</span></button>`;
  const n = NOTES[S.screen];
  const flow = [['home','Moments'],['event','Moment'],['sort','Sorting'],['done','Finished'],['vault','Vault']];
  $('notes').innerHTML = `<div class="flow" role="group" aria-label="Jump to screen">${flow.map(([id, l]) =>
      `<button data-jump="${id}" aria-current="${S.screen===id}">${l}</button>`).join('')}</div>
    <div class="mono kicker">${n.k}</div><h2>${n.h}</h2><p>${n.p}</p><p class="how">${n.how}</p>
    <div class="q"><b>Question for you</b>${n.q}</div>`;
}
function go(screen){ S.screen = screen; render(); const sc = $('scroll'); sc.scrollTop = 0; sc.classList.remove('enter'); void sc.offsetWidth; sc.classList.add('enter'); }
function startSort(s){ S.s = s; const k = picks[S.e][s]; const best = EVENTS[S.e].stacks[s].best;
  S.sel = new Set(k ? k : [best]); if (k && k.length > 1) S.mode = 'compare'; go('sort'); }
const nextUnsorted = e => EVENTS[e].stacks.findIndex((_, s) => !picks[e][s]);
let tt;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 1800); }

$('phone').addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'home') go('home');
  else if (a === 'vault') go('vault');
  else if (a === 'open'){ S.e = +b.dataset.e; go('event'); }
  else if (a === 'event') go('event');
  else if (a === 'sortat') startSort(+b.dataset.s);
  else if (a === 'sortnext') startSort(nextUnsorted(S.e));
  else if (a === 'mode'){ S.mode = b.dataset.m; if (S.mode === 'quick' && S.sel.size !== 1) S.sel = new Set([S.sel.size ? [...S.sel][0] : EVENTS[S.e].stacks[S.s].best]); render(); }
  else if (a === 'pick'){ S.sel = new Set([+b.dataset.j]); render(); }
  else if (a === 'toggle'){ const j = +b.dataset.j; S.sel.has(j) ? S.sel.delete(j) : S.sel.add(j); render(); }
  else if (a === 'commit'){
    const n = EVENTS[S.e].stacks[S.s].shots.length, k = S.sel.size;
    picks[S.e][S.s] = [...S.sel].sort((x, y) => x - y);
    if (!k) picks[S.e][S.s] = [];
    const nx = nextUnsorted(S.e);
    if (nx < 0) go('done'); else { startSort(nx); toast(`Kept ${k} · ${n-k} to Archive`); }
  }
  else if (a === 'toast') toast(b.dataset.msg);
});
$('notes').addEventListener('click', ev => {
  const b = ev.target.closest('[data-jump]'); if (!b) return;
  const id = b.dataset.jump;
  if (id === 'sort'){ if (S.e === 3) S.e = 0; startSort(Math.max(0, nextUnsorted(S.e))); }
  else if (id === 'done'){ S.e = 3; go('done'); }
  else { if (id === 'event' && S.screen === 'vault') S.e = 0; go(id); }
});
render();
</script>
